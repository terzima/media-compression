[package]
name = "media-compression"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.1"
media-engine = { path = "../crates/engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }


[dev-dependencies]
tempfile = "3.0"
